name: diagnostic-noms
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Noms des secrets et variables (sans les valeurs)
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
        run: |
          echo "Secrets :";   echo "$S" | jq -r 'keys[] | "  [" + . + "]"'
          echo "Variables :"; echo "$V" | jq -r 'keys[] | "  [" + . + "]"'
