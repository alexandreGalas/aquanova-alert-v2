name: debug-temporaire
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" "https://aquanova-america.fr/module-inscriptions/reserver/" -o p.html
          wc -c p.html
          echo "=== periode ==="; grep -n -o -i '.\{0,160\}periode.\{0,160\}' p.html | head -40
          echo "=== autour de l'intitulé ==="; grep -n -o '.\{0,400\}Du 2 au 8.\{0,400\}' p.html | head -5
          echo "=== scripts ==="; grep -n -o -i '<script[^>]*src="[^"]*"' p.html | head -30
          echo "=== ajax/url ==="; grep -n -o -i '.\{0,120\}\(ajax\|\.php\|semaine\|week\|suivant\|precedent\).\{0,120\}' p.html | head -40
